<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="250" r="245" fill="url(#bgGrad)" stroke="url(#tealGrad)" stroke-width="3"/>

  <!-- Outer ring dots -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- S letter - large, centered, modern -->
  <text x="250" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="220" font-weight="700" fill="url(#tealGrad)" text-anchor="middle" dominant-baseline="central">S</text>

  <!-- Thin accent line under S -->
  <line x1="140" y1="290" x2="360" y2="290" stroke="url(#tealGrad)" stroke-width="2" opacity="0.7"/>

  <!-- Small subtitle -->
  <text x="250" y="330" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#2dd4bf" text-anchor="middle" letter-spacing="6">INVESTMENT</text>
  <text x="250" y="360" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="4">MANAGEMENT</text>

  <!-- Small decorative diamond -->
  <rect x="244" y="380" width="12" height="12" rx="2" fill="#2dd4bf" opacity="0.8"/>
</svg>
