<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="250" cy="250" r="240" fill="url(#bg)" stroke="url(#accent)" stroke-width="3"/>
  
  <!-- S letter mark -->
  <text x="170" y="290" font-family="Georgia, serif" font-size="160" font-weight="bold" fill="url(#accent)" letter-spacing="-5">S</text>
  
  <!-- Small diagnostic bars next to the S -->
  <rect x="290" y="180" width="100" height="8" rx="4" fill="#14b8a6" opacity="0.8"/>
  <rect x="290" y="200" width="70" height="8" rx="4" fill="#14b8a6" opacity="0.6"/>
  <rect x="290" y="220" width="85" height="8" rx="4" fill="#14b8a6" opacity="0.7"/>
  <rect x="290" y="260" width="50" height="8" rx="4" fill="#2dd4bf" opacity="0.5"/>
  <rect x="290" y="280" width="95" height="8" rx="4" fill="#14b8a6" opacity="0.6"/>
  <rect x="290" y="300" width="65" height="8" rx="4" fill="#2dd4bf" opacity="0.5"/>
</svg>
